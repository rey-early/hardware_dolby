name: Build Dolby Sony 1.5 (Fast Native C++ & APK Builder)

on:
  push:
    branches: [ "main", "master", "14", "15" ]
  workflow_dispatch:

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: 26.1.10909125

      - name: Prepare Workspace Structure
        run: |
          mkdir -p output/apk output/libs/arm64-v8a

      # --- 1. PROSES BUILD APK (LunarisDolby) ---
      - name: Build LunarisDolby APK
        run: |
          echo "Checking for LunarisDolby source..."
          if [ -d "LunarisDolby" ]; then
            cd LunarisDolby
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease
              cp app/build/outputs/apk/release/*.apk $GITHUB_WORKSPACE/output/apk/
            else
              echo "No gradle wrapper found, looking for prebuilt APKs..."
              find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/apk/ \;
            fi
          else
            echo "LunarisDolby directory not found, checking root for prebuilts..."
            find . -name "LunarisDolby.apk" -exec cp {} $GITHUB_WORKSPACE/output/apk/ \;
          fi

      # --- 2. PROSES BUILD NATIVE LIBRARIES (C++ Libshims) ---
      - name: Compile C++ Source Files (Libshims)
        run: |
          if [ -d "libshims" ]; then
            cd libshims
            echo "Compiling C++ shared libraries using Android NDK Clang++..."
            
            # Target arsitektur arm64-v8a untuk Android API 34
            TARGET_TRIPLE="aarch64-linux-android34"
            TOOLCHAIN_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
            
            # Ambil semua berkas .cpp di dalam folder libshims
            SRC_FILES=$(find . -name "*.cpp")
            
            if [ ! -z "$SRC_FILES" ]; then
              echo "Found source files: $SRC_FILES"
              
              # Kompilasi menggunakan clang++ dengan standard C++17 dan mengabaikan beberapa warning standard shims
              $TOOLCHAIN_BIN/${TARGET_TRIPLE}-clang++ \
                -shared \
                -fPIC \
                -std=c++17 \
                -O2 \
                -Wall \
                -Wno-error \
                $SRC_FILES \
                -o $GITHUB_WORKSPACE/output/libs/arm64-v8a/libshim_dolby.so
                
              echo "libshim_dolby.so compiled successfully!"
            else
              echo "No .cpp source files found in libshims."
            fi
          fi

      # --- 3. PROSES PENGUMPULAN PROPRIETARY BLOBS & CONFIGS ---
      - name: Collect Proprietary Blobs & Overlays
        run: |
          if [ -d "proprietary" ]; then
            echo "Collecting proprietary vendor libraries..."
            find proprietary/ -name "*.so" -exec cp {} output/libs/arm64-v8a/ \; 2>/dev/null || true
          fi
          
          mkdir -p output/configs
          cp *.xml dolby.mk README.mkdn RemovePackagesDolby output/configs/ 2>/dev/null || true
          if [ -d "configs" ]; then cp -r configs/* output/configs/; fi

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dolby-Sony-1.5-Compiled-Package
          path: output/
          retention-days: 7
